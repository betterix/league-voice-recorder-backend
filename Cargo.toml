[package]
name = "league-voice-recorder-backend"
version = "1.3.3"
edition = "2024"
authors = ["Betterix"]
license = "AGPL-3.0-or-later"
description = "High-performance centralized remote audio storage service for League Voice Recorder"

[dependencies]
tokio = { version = "1.54", features = ["full"] }
axum = { version = "0.8", features = ["multipart", "matched-path"] }
axum-server = { version = "0.9", features = ["tls-rustls"] }
rustls = { version = "0.23", features = ["ring"] }
tower = { version = "0.5", features = ["util"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "chrono", "macros"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.11"
hex = "0.4"
subtle = "2.6"
regex = "1.13"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
uuid = { version = "1.29", features = ["v4", "fast-rng"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "time", "fmt"] }
rcgen = "0.14"
dashmap = "6.2"
base64 = "0.23"
sysinfo = "0.40"
futures-util = "0.3"
tokio-util = { version = "0.7", features = ["io"] }
dotenvy = "0.15"
thiserror = "2.0"
bytes = "1.12"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tempfile = "3.27"
