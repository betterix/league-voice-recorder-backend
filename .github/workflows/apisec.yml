name: APIsec Scan

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * 0' # Weekly scan every Sunday at 02:00 UTC

permissions:
  contents: read
  security-events: write

jobs:
  apisec_scan:
    name: 🛡️ APIsec Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      - name: 🔍 Run APIsec Scan
        uses: apisec-inc/apisec-run-scan@v1.0.6
        with:
          apisec-username: ${{ secrets.APISEC_USERNAME }}
          apisec-password: ${{ secrets.APISEC_PASSWORD }}
          apisec-project: "league-voice-recorder-backend"
        continue-on-error: true
