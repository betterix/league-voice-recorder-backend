name: Build & Release Container Image

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: 🧪 Run Automated Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v7

      - name: ⚡ Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: 📦 Cache Rust Dependencies
        uses: Swatinem/rust-cache@v2

      - name: 🔍 Check Code Formatting
        run: cargo fmt --check

      - name: 🛡️ Clippy Linter Check
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: 🧪 Execute Cargo Test Suite
        run: cargo test --verbose

  build:
    name: 🐳 Build (${{ matrix.platform.name }})
    needs: test
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: amd64
            architecture: linux/amd64
            runner: ubuntu-latest
          - name: arm64
            architecture: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v7

      - name: 🔑 Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: 🚀 Build and Push by Digest
        id: build-and-push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform.architecture }}
          outputs: type=image,"name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}",push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 📝 Export Digest
        run: |
          mkdir -p ${{ runner.temp }}/digests
          digest="${{ steps.build-and-push.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: 📤 Upload Digest Artifact
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.platform.name }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: 🔀 Merge Multi-Arch Manifests
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Download all digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: 🔑 Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: 🚀 Create Multi-Platform Manifest & Push
        run: |
          cd ${{ runner.temp }}/digests
          DIGEST_FILES=( *)
          TOOL_ARGS=()
          for file in "${DIGEST_FILES[@]}"; do
            TOOL_ARGS+=( "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:$file" )
          done

          VERSION_TAG="${GITHUB_REF_NAME#v}"
          if [ -z "$VERSION_TAG" ] || [ "$VERSION_TAG" = "main" ]; then
            VERSION_TAG="1.3.3"
          fi

          docker buildx imagetools create \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${VERSION_TAG} \
            "${TOOL_ARGS[@]}"

      - name: 🔍 Inspect Multi-Arch Manifest
        run: |
          docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
